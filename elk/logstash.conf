input {
  # Reçoit les logs de l'agent via TCP
  tcp {
    port => 5000
    codec => json
    tags => ["agent"]
  }

  # Reçoit les logs via Filebeat/Beats
  beats {
    port => 5044
    tags => ["beats"]
  }
}

filter {
  # Ajouter un timestamp si absent
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Extraire l'IP source si présente dans le log brut
  if [raw_log] {
    grok {
      match => {
        "raw_log" => "(?:from\s+)?(?<extracted_ip>(?:\d{1,3}\.){3}\d{1,3})"
      }
      tag_on_failure => []
    }
  }

  # Classifier la sévérité
  if [severity] == "HIGH" {
    mutate { add_field => { "risk_level" => "CRITIQUE" } }
  } else if [severity] == "MEDIUM" {
    mutate { add_field => { "risk_level" => "MOYEN" } }
  } else {
    mutate { add_field => { "risk_level" => "FAIBLE" } }
  }
}

output {
  # Stocker dans Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "xibaar-logs-%{+YYYY.MM.dd}"
  }

  # Debug en console
  stdout {
    codec => rubydebug
  }
}
