version: "3.9"

services:

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: xibaar-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "19200:9200"

  kibana:
    image: kibana:8.11.0
    container_name: xibaar-kibana
    ports:
      - "15601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  postgres:
    image: postgres:15
    container_name: xibaar-postgres
    environment:
      POSTGRES_DB: xibaar
      POSTGRES_USER: xibaar
      POSTGRES_PASSWORD: xibaar123
    ports:
      - "15432:5432"

  backend:
    build: ./backend
    container_name: xibaar-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - elasticsearch
      - postgres